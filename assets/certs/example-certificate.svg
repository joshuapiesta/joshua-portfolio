<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Example certificate placeholder">
  <rect width="800" height="560" fill="#fdfcf7"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#b08d2f" stroke-width="6"/>
  <rect x="40" y="40" width="720" height="480" fill="none" stroke="#b08d2f" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#2b2b2b">CERTIFICATE</text>
  <text x="400" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#6b6b6b" letter-spacing="6">OF COMPLETION</text>
  <text x="400" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#444">This is a placeholder image.</text>
  <text x="400" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#444">Drop your real certificate into assets/certs/</text>
  <text x="400" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#444">and add an entry to content/certifications.json</text>
  <circle cx="650" cy="440" r="48" fill="none" stroke="#b08d2f" stroke-width="4"/>
  <text x="650" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#b08d2f">SEAL</text>
  <line x1="120" y1="450" x2="360" y2="450" stroke="#2b2b2b" stroke-width="2"/>
  <text x="240" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6b6b6b">Signature</text>
</svg>
